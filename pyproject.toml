[project]
name = "mottle"
version = "0.27.9"
description = "Some quality of life improvements for Spotify"
authors = [{ name = "Andrii Yurchuk", email = "ay@mntw.re" }]
license = { file = "LICENSE" }
readme = "README.md"
homepage = "https://mottle.it"
repository = "https://github.com/Ch00k/mottle"
requires-python = ">=3.14"

dependencies = [
  "django==6.0.9",
  "environs==15.2.0",
  "cryptography==50.0.2",
  "django-htmx==1.29.0",
  "whitenoise==6.12.0",
  "sentry-sdk[django]==2.73.0",
  "django-prometheus==2.5.0",
  "prometheus-client==0.26.0",
  "openai==3.42.0",
  "pillow==13.0.0",
  "tiktoken==0.14.0",
  "django-q2==1.11.1",
  "lxml==6.1.3",
  "thefuzz==0.22.1",
  "django-dirtyfields==1.9.9",
  "unidecode==1.4.0",
  "country-converter==1.3.2",
  "json-log-formatter==1.2.1",
  "daphne==4.2.3",
  "django-hosts==7.0.0",
  "tekore==6.2.0",
  "croniter==6.2.4",
]

[dependency-groups]
dev = [
  "mypy==2.4.1",
  "django-stubs==6.0.9",
  "lxml-stubs==0.5.1",
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1",
  "pytest-django==4.14.0",
  "ruff>=0.17.3",
  "pytest-cov>=7.1.0",
  "minify-html>=0.18.1",
]
debug = ["ipython==9.18.0", "pdbpp==0.12.1"]

[tool.uv]
# country-converter 1.3.2 fails to import with pandas 3
constraint-dependencies = ["pandas<3"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D",   # pydocstyle
  "FIX", # flake8-fixme
  "TD",  # flake8-todo
  "TRY", # tryceratops
  "SLF", # flake8-self

  "ANN401",  # Allow Any type
  "B023",    # Loop variable
  "BLE001",  # Bare Exception
  "C901",    # Complexity
  "CPY001",  # Copyright notices
  "ICN001",  # datetime is imported by its own name
  "COM812",  # Trailing comma
  "DJ001",   # Django-specific rule
  "EM101",   # Exception uses string literal
  "EM102",   # Exception uses f-string
  "ERA001",  # Commented out code
  "FBT001",  # Boolean argument
  "FBT002",  # Boolean argument
  "G004",    # Logging statement uses f-string
  "N818",    # Exception class name
  "PLC0415", # Import not at top of file
  "PLR0911", # Too many return statements
  "PLR0912", # Too many branches
  "PLR0913", # Too many arguments
  "PLR2004", # Magic values
  "PLR0915", # Too many statements
  "PLR0917", # Too many positional arguments
  "RUF012",  # Mutable class attributes
  "S101",    # Use of assert
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S105",    # Hardcoded password strings in tests
  "S106",    # Hardcoded passwords OK in tests
  "ARG001",  # Unused function arguments (fixtures)
  #"RET504",  # Unnecessary assignment before yield/return
]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
# Migrations use the historical models, which differ from the current ones the plugin types them against
exclude = ["migrations/"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
show_column_numbers = true

[[tool.mypy.overrides]]
module = [
  "tekore.*",
  "django_q.*",
  "django_hosts.*",
  "dirtyfields.*",
  "json_log_formatter.*",
  "thefuzz.*",
  "country_converter.*",
  "factory.*",
  "ruamel.*",
  "croniter.*",
]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "mottle.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "mottle.settings"
django_debug_mode = "keep"
asyncio_default_fixture_loop_scope = "function"

[tool.djlint]
extend_exclude = "tests/golden/event_updates_email/html.html,tests/golden/playlist_updates_email/html.html"
