[project]
name = "mottle"
version = "0.27.9"
description = "Some quality of life improvements for Spotify"
authors = [{ name = "Andrii Yurchuk", email = "ay@mntw.re" }]
license = { file = "LICENSE" }
readme = "README.md"
homepage = "https://mottle.it"
repository = "https://github.com/Ch00k/mottle"
requires-python = ">=3.14"

dependencies = [
  "django==6.1.2",
  "environs==15.2.0",
  "cryptography==50.0.2",
  "django-htmx==1.29.0",
  "whitenoise==6.12.0",
  "sentry-sdk[django]==2.73.0",
  "openai==3.42.0",
  "pillow==13.0.0",
  "lxml==6.1.3",
  "rapidfuzz==3.14.6",
  "django-dirtyfields==1.9.9",
  "unidecode==1.4.0",
  "json-log-formatter==1.2.1",
  "django-hosts==7.0.0",
  # tekore 6.2.0 with https://github.com/felix-hilden/tekore/pull/351, without which pydantic 2.14 fails to parse a
  # playlist holding a local file. Back to the PyPI release once one includes it.
  "tekore @ git+https://github.com/Ch00k/tekore@be9eed62011da62852c7e6616f1b80153aa368f6",
  "curl-cffi==0.17.0",
  "httpx2==2.16.0",
  "stamina==26.1.0",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1",
  "pytest-django==4.14.0",
  "ruff>=0.17.3",
  "pytest-cov>=7.1.0",
  "minify-html>=0.18.1",
  "ty>=0.0.95",
  "django-stubs==6.1.2",
  "lxml-stubs==0.5.1",
  "watchfiles==1.3.0",
]
debug = ["ipython==9.18.0", "pdbpp==0.12.1"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D",   # pydocstyle
  "FIX", # flake8-fixme
  "TD",  # flake8-todo
  "TRY", # tryceratops
  "SLF", # flake8-self

  "ANN401",  # Allow Any type
  "B023",    # Loop variable
  "BLE001",  # Bare Exception
  "C901",    # Complexity
  "CPY001",  # Copyright notices
  "ICN001",  # datetime is imported by its own name
  "COM812",  # Trailing comma
  "DJ001",   # Django-specific rule
  "EM101",   # Exception uses string literal
  "EM102",   # Exception uses f-string
  "ERA001",  # Commented out code
  "FBT001",  # Boolean argument
  "FBT002",  # Boolean argument
  "G004",    # Logging statement uses f-string
  "N818",    # Exception class name
  "PLC0415", # Import not at top of file
  "PLR0911", # Too many return statements
  "PLR0912", # Too many branches
  "PLR0913", # Too many arguments
  "PLR2004", # Magic values
  "PLR0915", # Too many statements
  "PLR0917", # Too many positional arguments
  "RUF012",  # Mutable class attributes
  "S101",    # Use of assert
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S105",    # Hardcoded password strings in tests
  "S106",    # Hardcoded passwords OK in tests
  "ARG001",  # Unused function arguments (fixtures)
  #"RET504",  # Unnecessary assignment before yield/return
]

[tool.ruff.format]
line-ending = "lf"

[tool.ty.rules]
unused-ignore-comment = "error"
unused-type-ignore-comment = "error"

# ty does not see through Django's view decorators, so it takes every decorated view for a value of the wrong type.
[[tool.ty.overrides]]
include = ["web/views.py", "web/urls.py", "urlshortener/views.py", "urlshortener/urls.py"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
no-matching-overload = "ignore"

# Tests stand mocks in for the Spotify client, its models and the session.
[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
invalid-assignment = "ignore"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "mottle.settings"
django_debug_mode = "keep"
asyncio_default_fixture_loop_scope = "function"

[tool.djlint]
extend_exclude = "tests/golden/event_updates_email/html.html,tests/golden/playlist_updates_email/html.html,tests/data"
