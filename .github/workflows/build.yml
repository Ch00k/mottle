name: Build

on:
  push:
    branches:
      - main
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:

permissions:
  contents: read

# The deploy job requires a tag ref, so pushes to main and pull requests only test: production only ever deploys from a
# release tag, which is also the version the app reports.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Spatialite
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-mod-spatialite libgdal-dev

      # make check rebuilds the stylesheet to compare it with the committed one, which needs the release of the
      # Tailwind CLI the Makefile names, checked against the checksum the release published.
      - name: Install the Tailwind CLI
        run: |
          version=$(sed -n 's/^TAILWIND_VERSION := //p' Makefile)
          base="https://github.com/tailwindlabs/tailwindcss/releases/download/$version"
          curl -fsSLO "$base/tailwindcss-linux-x64"
          curl -fsSL "$base/sha256sums.txt" | grep ' ./tailwindcss-linux-x64$' | sed 's| ./| |' | sha256sum --check
          sudo install tailwindcss-linux-x64 /usr/local/bin/tailwindcss

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Check
        run: make check

      - name: Run tests
        run: make test_ci

      - name: Upload coverage
        if: github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  deploy:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Only a commit merged to main is released, so a tag pushed on any other commit deploys nothing.
      - name: Check that the tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - uses: docker/setup-buildx-action@v4

      # Build in the runner, with layers cached across runs. load puts the image in the local Docker daemon, to be
      # pushed once authenticated.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: registry.fly.io/mottle:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fly's registry tokens expire in about five minutes, so authenticate after the build.
      - name: Push the image to Fly's registry
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl auth docker
          docker push registry.fly.io/mottle:${{ github.ref_name }}

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: >-
          flyctl deploy --app mottle --ha=false --image registry.fly.io/mottle:${{ github.ref_name }}
          --env APP_VERSION=${{ github.ref_name }}

      # fly.toml defines no health check, so the deploy does not wait for the app to serve. The retries wait out
      # serve.sh's migration, which runs before uvicorn listens.
      - name: Check that the release serves
        run: >-
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors --max-time 30
          --output /dev/null https://www.mottle.it/
