name: Build

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Spatialite
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-mod-spatialite libgdal-dev

      # make check rebuilds the stylesheet to compare it with the committed one, which needs the release of the
      # Tailwind CLI the Makefile names, checked against the checksum the release published.
      - name: Install the Tailwind CLI
        run: |
          version=$(sed -n 's/^TAILWIND_VERSION := //p' Makefile)
          base="https://github.com/tailwindlabs/tailwindcss/releases/download/$version"
          curl -fsSLO "$base/tailwindcss-linux-x64"
          curl -fsSL "$base/sha256sums.txt" | grep ' ./tailwindcss-linux-x64$' | sed 's| ./| |' | sha256sum --check
          sudo install tailwindcss-linux-x64 /usr/local/bin/tailwindcss

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Check
        run: make check

      - name: Run tests
        run: make test_ci

      - name: Upload coverage
        if: github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
