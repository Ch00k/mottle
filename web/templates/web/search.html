{% extends "web/base.html" %}
{% block title %}
    {% if query %}
        {{ query }}
    {% else %}
        Search
    {% endif %}
{% endblock title %}
{% block content %}
    <div class="page pt-8 sm:pt-10">
        <form class="relative max-w-2xl"
              role="search"
              action="{% url 'search' %}"
              method="get"
              hx-on:submit="event.preventDefault()">
            <span class="pointer-events-none absolute inset-y-0 left-4 flex items-center text-fg-subtle">
                {% include "web/icons/search.html" with class="size-5" %}
            </span>
            <input type="search"
                   id="query"
                   name="query"
                   value="{{ query }}"
                   placeholder="Search for artists and playlists"
                   aria-label="Search for artists and playlists"
                   autocomplete="off"
                   {% if not query %}autofocus{% endif %}
                   class="input h-14 rounded-full pl-12 text-base"
                   hx-get="{% url 'search' %}"
                   hx-trigger="input changed delay:400ms, keyup[key=='Enter']"
                   hx-target="#search-results"
                   hx-swap="outerHTML">
        </form>
    </div>
    {% include "web/parts/search_results.html" %}
{% endblock content %}
