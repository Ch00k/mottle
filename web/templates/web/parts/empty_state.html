{% comment %}
An empty list's placeholder.

Parameters:
- icon: icon template to include
- title: heading text
- description: description text
{% endcomment %}
<div class="empty">
    <div class="empty-icon">{% include icon with class="size-6" %}</div>
    <h3 class="empty-title">{{ title }}</h3>
    <p class="empty-text">{{ description }}</p>
</div>
