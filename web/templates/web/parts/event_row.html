<li>
    <button class="flex w-full items-center gap-4 rounded-xl p-3 text-left transition-colors hover:bg-surface-2"
            hx-get="{% url 'event_details' event.id %}"
            hx-target="body"
            hx-swap="beforeend">
        {% include "web/parts/event_date.html" %}
        <span class="min-w-0 flex-1">
            <span class="block truncate font-semibold">
                {% if event.type == "live_stream" %}
                    Live stream
                {% else %}
                    {{ event.venue|default:"Venue to be announced" }}
                {% endif %}
            </span>
            <span class="block truncate text-sm text-fg-muted">
                {% if event.city or event.country %}
                    {{ event.city|default_if_none:"" }}{% if event.city and event.country %},{% endif %}
                    {{ event.country|default_if_none:"" }}
                    <span class="text-fg-subtle">/</span>
                {% endif %}
                {{ event.date|date:"l, Y" }}
            </span>
        </span>
        <span class="btn btn-secondary btn-sm hidden sm:inline-flex">
            {% if event.type == "live_stream" %}
                {% include "web/icons/video.html" %}<span>Watch</span>
            {% else %}
                {% include "web/icons/ticket.html" %}<span>Tickets</span>
            {% endif %}
        </span>
        {% include "web/icons/chevron_right.html" with class="size-4 text-fg-subtle sm:hidden" %}
    </button>
</li>
