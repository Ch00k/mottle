<button class="chip shrink-0 {% if enabled %}chip-success{% endif %} transition-colors hover:brightness-125"
        hx-post="{% url 'auto_accept_playlist_updates' playlist_id %}"
        hx-target="this"
        hx-swap="outerHTML"
        hx-include="previous input"
        title="Add updates to the playlist without asking">
    Auto-accept {% if enabled %}on{% else %}off{% endif %}
</button>
