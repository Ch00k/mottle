{% if playlists %}
    <div class="cover-grid">
        {% for playlist in playlists %}
            {% include "web/parts/playlist_card.html" %}
        {% endfor %}
    </div>
{% else %}
    {% include "web/parts/empty_state.html" with icon="web/icons/music.html" title="No playlists found" description="There are no playlists to show here." %}
{% endif %}
