<form class="flex min-w-0 flex-1 items-center gap-2"
      hx-post="{% url 'rename_playlist' playlist.id %}"
      hx-target="#playlist-name-container"
      data-success-refresh>
    <input type="text"
           name="name"
           value="{{ playlist.name }}"
           required
           autofocus
           aria-label="Playlist name"
           class="input">
    <button type="submit"
            class="btn btn-primary btn-icon btn-sm"
            title="Save"
            aria-label="Save">{% include "web/icons/check.html" %}</button>
    <button type="button"
            class="btn btn-ghost btn-icon btn-sm"
            hx-delete="{% url 'rename_playlist' playlist.id %}"
            hx-target="#playlist-name-container"
            title="Cancel"
            aria-label="Cancel">{% include "web/icons/close.html" %}</button>
</form>
