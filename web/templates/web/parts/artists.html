<div class="cover-grid">
    {% for artist in artists %}
        <article class="tile">
            <div class="tile-cover rounded-full">
                {% if artist.image_url_large %}
                    <img src="{{ artist.image_url_large }}" alt="" loading="lazy">
                {% else %}
                    <div class="flex size-full items-center justify-center text-fg-subtle">
                        {% include "web/icons/user.html" with class="size-10" %}
                    </div>
                {% endif %}
            </div>
            <div class="min-w-0 px-1 pb-1">
                <a href="{% url 'albums' artist.id %}" class="tile-link">
                    <h3 class="tile-title">{{ artist.name }}</h3>
                </a>
                <p class="tile-meta mt-0.5">
                    {% if artist.genres %}
                        {{ artist.genres|slice:":2"|join:", " }}
                    {% else %}
                        Artist
                    {% endif %}
                </p>
            </div>
            <div class="tile-actions">
                <button class="btn btn-primary btn-sm shadow-lg"
                        hx-get="{% url 'albums' artist.id %}"
                        hx-target="body"
                        hx-swap="beforeend">
                    {% include "web/icons/plus.html" %}<span>Discography</span>
                </button>
            </div>
        </article>
    {% endfor %}
</div>
