<dialog id="confirm-dialog"
        class="modal max-w-sm"
        aria-labelledby="confirm-dialog-question">
    <form method="dialog">
        <div class="p-5">
            <p id="confirm-dialog-question"
               class="text-base font-medium"
               data-question></p>
        </div>
        <div class="modal-footer border-t-0 pt-0">
            <button class="btn btn-ghost" value="cancel">Cancel</button>
            <button class="btn btn-primary" value="confirm">Confirm</button>
        </div>
    </form>
</dialog>
