<button class="btn btn-ghost btn-icon btn-sm track-row-actions hover:text-danger"
        aria-label="Remove {{ track.name }} from saved tracks"
        title="Remove from saved tracks"
        data-danger
        hx-post="{% url 'remove_saved_tracks' %}"
        hx-vals='{"track-id": "{{ track.id }}"}'
        hx-confirm="Remove {{ track.name }} from your saved tracks?"
        hx-target="closest tr"
        hx-swap="outerHTML">{% include "web/icons/trash.html" %}</button>
