<dialog tabindex="-1" class="modal" aria-labelledby="modal-title">
    {% include "web/parts/modal_header.html" with title="Merge playlist" %}
    <form class="contents"
          hx-post="{% url 'merge_playlist' playlist_id %}"
          hx-swap="none"
          hx-indicator="#merge-submit"
          data-close-dialog>
        <div class="modal-body">
            <div class="flex items-center gap-3">
                {% if playlist_image_url %}
                    <img src="{{ playlist_image_url }}"
                         alt="{{ playlist_name }} cover"
                         class="size-12 shrink-0 rounded-lg object-cover">
                {% endif %}
                <div class="min-w-0">
                    <p class="eyebrow">Merging</p>
                    <p class="truncate font-semibold" title="{{ playlist_name }}">{{ playlist_name }}</p>
                </div>
            </div>
            <fieldset class="panel space-y-3">
                <legend class="sr-only">Merge into</legend>
                <label class="flex items-center gap-3 text-sm font-medium">
                    <input type="radio"
                           name="merge-type"
                           value="new"
                           class="radio"
                           checked
                           data-shows="new-playlist-section">
                    Into a new playlist
                </label>
                <div id="new-playlist-section" class="pl-7">
                    <input type="text"
                           name="new-playlist-name"
                           placeholder="New playlist's name"
                           aria-label="New playlist's name"
                           class="input">
                </div>
                <label class="flex items-center gap-3 text-sm font-medium">
                    <input type="radio"
                           name="merge-type"
                           value="existing"
                           class="radio"
                           data-shows="existing-playlist-section">
                    Into one of your playlists
                </label>
                <div id="existing-playlist-section" class="pl-7" hidden>
                    <select name="merge-target"
                            aria-label="Playlist to merge into"
                            class="select">
                        <option value="">Choose a playlist</option>
                        {% for playlist in playlists %}<option value="{{ playlist.id }}">{{ playlist.name }}</option>{% endfor %}
                    </select>
                </div>
            </fieldset>
            <div>
                <label class="option -mx-3">
                    <input type="checkbox"
                           name="auto-update"
                           checked
                           class="switch"
                           data-enables="auto-accept">
                    <span>
                        <span class="option-title block">Watch for new tracks</span>
                        <span class="option-hint block">Get tracks added to this playlist offered as updates</span>
                    </span>
                </label>
                <label class="option -mx-3">
                    <input type="checkbox" id="auto-accept" name="auto-accept" class="switch">
                    <span>
                        <span class="option-title block">Add them automatically</span>
                        <span class="option-hint block">New tracks go into the merged playlist without asking</span>
                    </span>
                </label>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button"
                    class="btn btn-ghost"
                    onclick="this.closest('dialog').close()">Cancel</button>
            <button type="submit" id="merge-submit" class="btn btn-primary">
                {% include "web/icons/merge.html" %}<span>Merge</span>
            </button>
        </div>
    </form>
</dialog>
